name: quality

on:
  push:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      DISABLE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p reports/raw reports/consolidated
      - run: echo "TS=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      - run: python -m pytest -q --maxfail=1 --disable-warnings --junitxml=reports/raw/junit_${TS}.xml
      - run: python -m pytest --cov=src --cov-report=xml:reports/raw/coverage_${TS}.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: raw-unit
          path: reports/raw

  debt-tech:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p reports/raw
      - run: echo "TS=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      - run: python -m flake8 src/ > reports/raw/flake8_${TS}.log
      - run: python -m pylint src --output-format=json2 > reports/raw/pylint_${TS}.json
      - run: python -m radon cc src -j > reports/raw/radon_${TS}.json
      - uses: actions/upload-artifact@v4
        with:
          name: raw-debt
          path: reports/raw

  perf-k6:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      DISABLE_AUTH: "true"
      BASE_URL: "http://localhost:8000"
      K6_PROFILE: "smoke"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digicheese
          MYSQL_USER: group2
          MYSQL_PASSWORD: digicheese
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: grafana/setup-k6-action@v1
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p reports/raw
      - run: echo "TS=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      - run: |
          nohup uvicorn src.main:app --host 0.0.0.0 --port 8000 > reports/raw/uvicorn_${TS}.log 2>&1 &
          for i in {1..20}; do
            if curl -sf http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck failed" && exit 1
      - run: k6 run --summary-export=reports/raw/k6_${TS}.json perf/k6_template.js
      - uses: actions/upload-artifact@v4
        with:
          name: raw-perf
          path: reports/raw

  consolidate-kpi:
    runs-on: ubuntu-latest
    needs: [unit-tests, debt-tech, perf-k6]
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: mkdir -p reports/raw reports/consolidated
      - uses: actions/download-artifact@v4
        with:
          path: reports/raw
          merge-multiple: true
      - run: python tools/collect_kpi.py
      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-kpi
          path: reports/consolidated
